name: Deploy ABCN to GitHub Pages (legacy fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Dynamic application notice
        run: echo "ABCN now uses a database-backed Events CMS and is deployed on Vercel. GitHub Pages static deployment is intentionally disabled."
